<!--
  Paste into Supabase > Authentication > Emails > Templates, in BOTH "Magic Link" and "Confirm signup"
  (first-time users get "Confirm signup", returning users get "Magic Link").
  Subject: Your EverGreen MCP Connector sign-in code
-->
<div style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;max-width:480px;margin:0 auto;padding:32px 24px;color:#0f1f17">
  <div style="font-weight:600;font-size:17px;margin-bottom:24px">
    <span style="display:inline-block;width:28px;height:28px;border-radius:8px;background:#1f9d55;vertical-align:middle;margin-right:8px"></span>
    EverGreen MCP Connector
  </div>
  <h1 style="font-size:20px;margin:0 0 8px">Your EverGreen MCP Connector code</h1>
  <p style="color:#5b6b62;margin:0 0 20px">Enter this code to connect your AI assistant. It expires in a few minutes.</p>
  <div style="font-size:32px;font-weight:700;letter-spacing:8px;background:#f3f6f4;border-radius:12px;padding:16px;text-align:center">{{ .Token }}</div>
  <p style="color:#5b6b62;font-size:13px;margin:24px 0 0">If you didn't try to sign in, you can ignore this email.</p>
</div>
